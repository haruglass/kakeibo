<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>家計簿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link class="main-manifest" rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link class="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  
  <style>
    /* 【デザイン設定：カラー変数】ダークモードの基本色を定義 */
    :root { 
      --bg: #222222;     /* 背景色 */
      --card: #333333;   /* 入力欄やカードの背景色 */
      --text: #ffffff;   /* メインの文字色（白） */
      --border: #555555; /* 枠線や区切り線の色 */
      --sub: #999999;    /* 補助的な文字色（グレー） */
    }
    
    /* 【全体スタイル】画面全体の背景やスクロールの制御 */
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; margin: 0; overflow: hidden; }
    .container { max-width: 500px; margin: auto; height: 100vh; display: flex; flex-direction: column; position: relative; }
    
    /* 【各ページの共通スタイル】下部ナビの高さ分、下側に余白を空ける */
    .tab-content { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 85px; }
    /* 非表示コントロール用クラス */
    .display-none { display: none !important; }
    /* 入力フォームの余白調整 */
    .field { margin-bottom: 0.6rem !important; }
    /* 入力欄と選択ボックスのデザイン（背景を暗く、文字を白に） */
    .input, .select select { font-size: 1.1rem !important; background-color: var(--card) !important; color: #fff !important; border: 1px solid var(--border) !important; height: 2.6em; }
    .label { color: var(--sub) !important; font-size: 0.9rem !important; margin-bottom: 0.2rem !important; font-weight: normal; }
    
    /* 【履歴ページ：フィルターエリア】上部に並ぶ選択ボックス（2列のグリッド構造） */
    .filter-area { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .filter-select select { background-color: #1a1a1a !important; color: #fff !important; border: 1px solid var(--border) !important; width: 100%; height: 2.4em; border-radius: 4px; font-size: 0.9rem; padding-left: 8px; }

    /* 【履歴ページ：各明細のスタイル】 */
    .history-item { border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 1rem; position: relative; }
    .history-top { display: flex; justify-content: space-between; align-items: flex-end; padding-right: 50px; }
    /* 履歴ページの金額を確実に白（#ffffff）にする設定 */
    .history-amount { font-size: 1.2rem; font-weight: bold; color: #ffffff !important; }
    /* 削除ボタン（赤枠・赤文字） */
    .delete-btn { position: absolute; right: 0; top: 12px; color: #ff6666; font-size: 0.8rem; border: 1px solid #ff6666; padding: 2px 8px; border-radius: 4px; cursor: pointer; }

    /* 【統計ページ：各カードとメイン支出額】 */
    .stat-card { border-bottom: 1px solid var(--border); padding: 20px 0; }
    .main-expense { font-size: 2.3rem; font-weight: bold; line-height: 1.1; margin: 5px 0; color: #ffffff; }
    .sub-info { font-size: 1rem; color: var(--sub); display: flex; gap: 20px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .detail-item { font-size: 1rem; background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; }
    .detail-item strong { color: #ffffff; }

    /* 【統計ページ：推移（トレンド）の画面表示】 */
    #trend-view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 1000; padding: 20px; display: flex; flex-direction: column; }
    .trend-list-scroll { flex: 1; overflow-y: auto; }
    .trend-list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 1.2rem; color: #ffffff; }
    .back-btn { background: var(--card); color: #fff; border: 1px solid var(--border); padding: 10px 20px; border-radius: 6px; margin-bottom: 15px; align-self: flex-start; }

    /* 【下部ナビゲーションバー】 */
    .navbar-bottom { position: absolute; bottom: 0; width: 100%; background: #1a1a1a; border-top: 1px solid var(--border); display: flex; height: 75px; z-index: 500; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; color: #666; cursor: pointer; }
    .nav-item.is-active { color: #fff; font-weight: bold; border-top: 3px solid #fff; }
    
    /* 記録するボタン・読み込み中画面 */
    .btn-submit { background: #eeeeee !important; color: #000 !important; font-weight: bold; border: none; width: 100%; padding: 14px; border-radius: 6px; font-size: 1.3rem; margin-top: 10px; }
    #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:2000; }
  </style>
</head>
<body>
  <div id="loading">読み込み中...</div>
  
  <div class="container">
    <div id="page-input" class="tab-content">
      <form id="kakeiboForm">
        <div class="columns is-mobile is-gapless mb-0">
          <div class="column mr-1"><div class="field"><label class="label">日付</label><input class="input" type="date" id="date" required></div></div>
          <div class="column"><div class="field"><label class="label">区分</label><div class="select is-fullwidth"><select id="type" onchange="updateForm()"><option value="支出">支出</option><option value="収入">収入</option><option value="振替">振替</option></select></div></div></div>
        </div>
        <div class="field"><label class="label">金額</label><input class="input" type="text" id="amount" placeholder="0" onchange="calculateAmount(this)"></div>
        <div id="standard-account" class="field"><label class="label">資産</label><div class="select is-fullwidth"><select id="account"><option>現金</option><option>ゆうちょ</option><option>給料</option><option>PayPay</option><option>バンドル</option><option>メルペイ</option></select></div></div>
        <div id="transfer-accounts" class="display-none">
          <div class="field"><label class="label">振替元</label><div class="select is-fullwidth"><select id="accountFrom"><option>現金</option><option>ゆうちょ</option><option>給料</option><option>PayPay</option><option>バンドル</option><option>メルペイ</option></select></div></div>
          <div class="field"><label class="label">振替先</label><div class="select is-fullwidth"><select id="accountTo"><option>現金</option><option>ゆうちょ</option><option>給料</option><option>PayPay</option><option>バンドル</option><option>メルペイ</option></select></div></div>
        </div>
        <div id="category-field" class="field"><label class="label">カテゴリー</label><div class="select is-fullwidth"><select id="category"></select></div></div>
        <div class="field"><label class="label">メモ</label><input class="input" type="text" id="memo"></div>
        <button type="submit" id="submitBtn" class="btn-submit">記録する</button>
      </form>
    </div>
    
    <div id="page-history" class="tab-content display-none">
      <div class="filter-area">
        <div class="filter-select">
          <select id="filter-month" onchange="applyFilter()">
            <option value="all">すべての月</option>
          </select>
        </div>
        <div class="filter-select">
          <select id="filter-type" onchange="applyFilter()">
            <option value="all">すべての区分</option>
            <option value="支出">支出</option>
            <option value="収入">収入</option>
            <option value="振替">振替</option>
          </select>
        </div>
        <div class="filter-select">
          <select id="filter-account" onchange="applyFilter()">
            <option value="all">すべての資産</option>
            <option value="現金">現金</option>
            <option value="ゆうちょ">ゆうちょ</option>
            <option value="給料">給料</option>
            <option value="PayPay">PayPay</option>
            <option value="バンドル">バンドル</option>
            <option value="メルペイ">メルペイ</option>
          </select>
        </div>
        <div class="filter-select">
          <select id="filter-category" onchange="applyFilter()">
            <option value="all">すべてのカテゴリ</option>
            <option value="食費">食費</option>
            <option value="趣味">趣味</option>
            <option value="服 美容">服 美容</option>
            <option value="生活費">生活費</option>
            <option value="交際費">交際費</option>
            <option value="医療">医療</option>
            <option value="年金">年金</option>
            <option value="給料">給料</option>
            <option value="お小遣い">お小遣い</option>
            <option value="その他">その他</option>
            <option value="調整">調整</option>
          </select>
        </div>
      </div>
      <div id="history-list"></div>
    </div>
    
    <div id="page-balance" class="tab-content display-none"><div id="balance-list"></div></div>
    <div id="page-stats" class="tab-content display-none"><div id="stats-list"></div></div>
    <div id="trend-view" class="display-none">
      <button class="back-btn" onclick="closeTrend()">← 戻る</button>
      <h3 id="trend-title" style="font-size:1.5rem; font-weight:bold; color:white;"></h3>
      <div id="trend-data-list" class="trend-list-scroll"></div>
    </div>

    <nav class="navbar-bottom">
      <div class="nav-item is-active" id="nav-input" onclick="switchTab('input')"><span>記録</span></div>
      <div class="nav-item" id="nav-history" onclick="switchTab('history')"><span>履歴</span></div>
      <div class="nav-item" id="nav-balance" onclick="switchTab('balance')"><span>資産</span></div>
      <div class="nav-item" id="nav-stats" onclick="switchTab('stats')"><span>統計</span></div>
    </nav>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwidKnpabBiYCSgH8GQ7X0VsFb4R_3jedpJUIEiencZoJxiT-cFrVAc3NHK74N_T3As6Q/exec";
    
    const categories = { "支出": ["食費", "趣味", "服 美容", "生活費", "交際費", "医療", "その他", "調整"], "収入": ["年金", "給料", "お小遣い", "利子", "その他"] };
    const expenseLabels = ["食費", "趣味", "服 美容", "生活費", "交際費", "医療", "その他", "調整"];
    const incomeLabels = ["年金", "給料", "お小遣い", "利子", "その他"];
    
    let currentStatsData = [];
    let currentHistoryData = [];

    function calculateAmount(input) {
      try {
        const val = input.value.replace(/[^-+*/0-9.]/g, '');
        if (val && /[+\-*/]/.test(val)) input.value = Function('"use strict";return (' + val + ')')();
      } catch (e) { }
    }

    // 入力フォームの表示切り替え
    function updateForm() {
      const type = document.getElementById('type').value;
      document.getElementById('transfer-accounts').classList.toggle('display-none', type !== '振替');
      document.getElementById('standard-account').classList.toggle('display-none', type === '振替');
      document.getElementById('category-field').classList.toggle('display-none', type === '振替');
      const catSelect = document.getElementById('category');
      catSelect.innerHTML = '';
      if (categories[type]) categories[type].forEach(c => catSelect.add(new Option(c, c)));
    }

    // タブ切り替え
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('display-none'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('is-active'));
      document.getElementById('page-' + tab).classList.remove('display-none');
      document.getElementById('nav-' + tab).classList.add('is-active');
      if(tab !== 'input') loadData();
    }

    // 【シンプル化】文字列から「年」と「月」の情報を安全に抽出する関数
    function extractYearMonthStr(dateStr) {
      if (!dateStr) return null;
      const s = String(dateStr).trim();
      // 「2026/07/03」や「2026-07-03」などの先頭部分から4桁の年と2桁の月を取り出す
      const match = s.match(/^(\d{4})[-/](\d{1,2})/);
      if (match) {
        return {
          year: match[1],
          month: match[2].padStart(2, '0'),
          key: match[1] + "-" + match[2].padStart(2, '0') // 例: "2026-07"
        };
      }
      return null;
    }

    // スプレッドシートからデータをロード
    async function loadData() {
      document.getElementById('loading').style.display = 'flex';
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        currentStatsData = data.statsBody;
        currentHistoryData = data.history;
        
        // 月選択肢を生成
        updateMonthFilterOptions(data.statsBody);
        applyFilter();

        // 資産残高リストの描画
        document.getElementById('balance-list').innerHTML = data.balances.map(row => `
          <div class="is-flex is-justify-content-space-between py-4" style="border-bottom:1px solid var(--border); font-size:1.3rem">
            <span>${row[0]}</span><strong style="color:#fff">¥${Number(row[1]||0).toLocaleString()}</strong>
          </div>`).join('');
        
        // 統計情報の描画
        document.getElementById('stats-list').innerHTML = data.statsBody.map((row) => {
          const ym = extractYearMonthStr(row[0]);
          const displayLabel = ym ? ym.year.substring(2) + '年' + Number(ym.month) + '月' : row[0];
          return `
          <div class="stat-card">
            <div style="color:var(--sub)">${displayLabel}</div>
            <div onclick="showTrend('支出合計', 1)">
              <div class="main-expense">¥${row[1].toLocaleString()}</div>
              <div class="sub-info">
                <span onclick="event.stopPropagation(); showTrend('収入合計', 11);" style="border-bottom:1px solid var(--sub)">収入 ¥${row[11].toLocaleString()}</span>
                <span onclick="event.stopPropagation(); showTrend('収支', 17);" style="border-bottom:1px solid var(--sub)">収支 ¥${row[17].toLocaleString()}</span>
              </div>
            </div>
            <div class="detail-grid">
              ${expenseLabels.map((l, i) => `<div class="detail-item" onclick="showTrend('${l}', ${i+2})"><span>${l}</span><strong>¥${row[i+2].toLocaleString()}</strong></div>`).join('')}
              ${incomeLabels.map((l, i) => `<div class="detail-item" onclick="showTrend('${l}', ${i+12})"><span>${l}</span><strong>¥${row[i+12].toLocaleString()}</strong></div>`).join('')}
            </div>
          </div>`;
        }).join('');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function updateMonthFilterOptions(statsBody) {
      const monthSelect = document.getElementById('filter-month');
      const currentSelectedValue = monthSelect.value;
      
      monthSelect.innerHTML = '<option value="all">すべての月</option>';
      
      statsBody.forEach(row => {
        const ym = extractYearMonthStr(row[0]);
        if (ym) {
          const label = ym.year.substring(2) + "年" + Number(ym.month) + "月";
          monthSelect.add(new Option(label, ym.key));
        }
      });
      
      monthSelect.value = currentSelectedValue || "all";
    }

    // A列の文字列をそのまま使い、"YYYY-MM"の形で厳密に比較する
    function applyFilter() {
      const monthFilter = document.getElementById('filter-month').value; // 例: "2026-07"
      const typeFilter = document.getElementById('filter-type').value;
      const accountFilter = document.getElementById('filter-account').value;
      const categoryFilter = document.getElementById('filter-category').value;
      
      const filteredData = currentHistoryData.filter(item => {
        let matchMonth = true;
        if (monthFilter !== 'all' && item.date) {
          const ym = extractYearMonthStr(item.date);
          matchMonth = (ym && ym.key === monthFilter);
        }

        const matchType = (typeFilter === 'all' || item.type === typeFilter);
        const matchAccount = (accountFilter === 'all' || item.account === accountFilter);
        const matchCategory = (categoryFilter === 'all' || item.category === categoryFilter);
        return matchMonth && matchType && matchAccount && matchCategory;
      });

      // 画面に整形して出力（日付はA列そのまま）
      document.getElementById('history-list').innerHTML = filteredData.map(item => {
        return `
        <div class="history-item">
          <div class="history-top"><span>${item.date} · ${item.account}</span><strong class="history-amount">¥${Number(item.amount).toLocaleString()}</strong></div>
          <div style="font-size:0.85rem; color:var(--sub)">${item.category} (${item.type}) ${item.memo ? '· '+item.memo : ''}</div>
          <div class="delete-btn" onclick="confirmDelete(${item.rowNum})">削除</div>
        </div>`;
      }).join('');
    }

    // 明細データ削除リクエスト
    async function confirmDelete(rowNum) {
      if (!confirm("削除しますか？")) return;
      document.getElementById('loading').style.display = 'flex';
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ method: 'delete', rowNum: rowNum }) });
      loadData();
    }

    // トレンド推移表示
    function showTrend(label, colIdx) {
      document.getElementById('trend-view').classList.remove('display-none');
      document.getElementById('trend-title').innerText = label + " の推移";
      document.getElementById('trend-data-list').innerHTML = currentStatsData.map(r => {
        const ym = extractYearMonthStr(r[0]);
        const displayMonth = ym ? ym.year.substring(2) + '年' + Number(ym.month) + '月' : r[0];
        return `<div class="trend-list-item"><span>${displayMonth}</span><strong>¥${r[colIdx].toLocaleString()}</strong></div>`;
      }).join('');
    }

    function closeTrend() { document.getElementById('trend-view').classList.add('display-none'); }

    // 家計簿データ送信処理
    document.getElementById('kakeiboForm').onsubmit = async function(e) {
      e.preventDefault();
      calculateAmount(document.getElementById('amount'));
      document.getElementById('loading').style.display = 'flex';
      
      const payload = {
        method: 'add',
        date: document.getElementById('date').value,
        type: document.getElementById('type').value,
        amount: document.getElementById('amount').value,
        account: document.getElementById('account').value,
        accountFrom: document.getElementById('accountFrom').value,
        accountTo: document.getElementById('accountTo').value,
        category: document.getElementById('category').value,
        memo: document.getElementById('memo').value
      };
      
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      document.getElementById('loading').style.none = 'none';
      this.reset();
      document.getElementById('date').value = new Date().toISOString().substring(0, 10);
      updateForm();
      alert("記録しました");
    };

    window.onload = () => {
      document.getElementById('date').value = new Date().toISOString().substring(0, 10);
      updateForm();
    };
  </script>
</body>
</html>
